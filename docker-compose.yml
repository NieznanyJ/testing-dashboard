services:
  postgres:
    image: postgres:17
    container_name: testops-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: testops
    ports:
      - "5432:5432"
    volumes:
      - testops_postgres_data:/var/lib/postgresql/data

volumes:
  testops_postgres_data:
